name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          rm -rf _site
          cp -R auto365 _site
          BASE_PATH="$BASE_PATH" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const base = (process.env.BASE_PATH || '').replace(/\/$/, '');
          if (!base) throw new Error('GitHub Pages base path is empty');

          function visit(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) visit(file);
              else if (entry.isFile() && file.endsWith('.html')) {
                let html = fs.readFileSync(file, 'utf8');
                html = html.replace(/((?:href|src|srcset|action)=["'])\/(?!\/|api\/)/g, `$1${base}/`);
                html = html.replace(/(url\(\s*)\/(?!\/|api\/)/g, `$1${base}/`);
                fs.writeFileSync(file, html);
              }
            }
          }

          visit('_site');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
